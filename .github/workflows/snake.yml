name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ruban-Edward
          # color_dots = 5 levels: empty cell -> most contributions
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#d4a017&color_dots=#e2e8f0,#bae6fd,#7dd3fc,#0ea5e9,#0369a1
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e8c46a&color_dots=#1b2638,#14527a,#0284c7,#38bdf8,#bae6fd

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
