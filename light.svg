<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
     role="img" aria-label="R. Ruban Edward — Software Engineer profile banner">
  <title>R. Ruban Edward — Software Engineer</title>
  <desc>Premium terminal-inspired software engineering profile banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
      <animate attributeName="x1" values="0;0.12;0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset=".52" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
      <animate attributeName="x2" values="1;.7;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#06B6D4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CBD5E1" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#06B6D4" stroke-opacity=".045"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .name{font:700 36px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#0F172A}
      .headline{font:600 20px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#06B6D4}
      .section{font:700 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:2px;fill:#475569}
      .label{font:600 12px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#06B6D4}
      .value{font:500 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#0F172A}
      .small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#475569}
      .chip{font:600 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#0F172A}
      .ascii{font:600 10px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#06B6D4;white-space:pre}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="610" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1180" height="610" rx="24" fill="url(#grid)"/>
  <circle cx="180" cy="230" r="260" fill="url(#glow1)" filter="url(#shadow)">
    <animate attributeName="cx" values="180;220;180" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="90" r="240" fill="url(#glow2)" filter="url(#shadow)">
    <animate attributeName="cy" values="90;130;90" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer frame -->
  <rect x="12" y="12" width="1156" height="586" rx="22" fill="none" stroke="url(#accent)" stroke-opacity=".48"/>
  <rect x="13" y="13" width="1154" height="584" rx="21" fill="none" stroke="#CBD5E1" stroke-opacity=".4"/>

  <!-- Terminal chrome -->
  <rect x="28" y="28" width="1124" height="42" rx="13" fill="#FFFFFF" fill-opacity=".68" stroke="#CBD5E1" stroke-opacity=".45"/>
  <circle cx="52" cy="49" r="6" fill="#EF4444"/>
  <circle cx="72" cy="49" r="6" fill="#F59E0B"/>
  <circle cx="92" cy="49" r="6" fill="#22C55E"/>
